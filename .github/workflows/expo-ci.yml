name: Expo CI

# Runs the shared TypeScript core's checks for the Expo app in app/.
# Deliberately does NOT deploy anything: the live GitHub Pages site is still
# the root index.html until the EXPO branch is merged into main.

on:
  push:
    branches: [EXPO]
    paths: ["app/**", ".github/workflows/expo-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/expo-ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (tides vs LINZ table, insights, locations)
        run: npm test -- --ci
      - name: Web export builds
        run: npm run setup:web && CI=1 npx expo export -p web
