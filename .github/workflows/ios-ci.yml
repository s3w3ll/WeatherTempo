name: iOS CI

# Builds + tests the native app on a GitHub macOS runner (free: this repo is public),
# so no local Mac / Xcode version is needed to know whether the code compiles.
# Output: an UNSIGNED .ipa artifact. Sign + install it from Windows with Sideloadly
# or AltServer using a free Apple ID (7-day expiry), see ios/README.md.

on:
  push:
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-ci.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        working-directory: .
        run: |
          ls -d /Applications/Xcode_*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Test WeatherTempoKit
        working-directory: ios/Packages/WeatherTempoKit
        # METEOGRAM_OUT makes the snapshot tests keep their rendered PNGs (uploaded below)
        env:
          METEOGRAM_OUT: ${{ github.workspace }}/meteogram-out
        run: swift test

      - name: Upload chart snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meteogram-snapshots
          path: meteogram-out/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iOS Simulator (compile check)
        run: |
          xcodebuild build \
            -project WeatherTempo.xcodeproj -scheme WeatherTempo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device .ipa
        run: |
          xcodebuild build \
            -project WeatherTempo.xcodeproj -scheme WeatherTempo \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WeatherTempo.app Payload/
          zip -qr WeatherTempo-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WeatherTempo-unsigned-ipa
          path: ios/WeatherTempo-unsigned.ipa
          retention-days: 14
