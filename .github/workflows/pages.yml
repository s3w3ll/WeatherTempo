name: Deploy web (GitHub Pages)

# Builds the Expo web app and publishes it to GitHub Pages.
#
# ONE-TIME SETUP (until you do this the deploy job fails harmlessly and the
# current site is untouched):
#   1. Repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#      (This stops Pages serving the branch root, so only do it when you're
#      ready for the Expo site to replace the old one.)
#   2. Settings → Environments → github-pages → Deployment branches: allow
#      `EXPO` (and `main` after the cutover).
#
# CUTOVER: when the EXPO branch is merged, change `branches: [EXPO]` below to
# `branches: [main]`.

on:
  push:
    branches: [EXPO]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck and test (a broken build never deploys)
        run: npm run typecheck && npm test -- --ci
      - name: Export web (also fetches CanvasKit)
        run: npm run export:web
        env:
          CI: "1"

      # Over-the-air update for the iOS app: the same JS, built for iOS, served at /updates/ios/.
      # Held back (with a warning) if the native side changed without a runtimeVersion bump, so new
      # JS never reaches an ipa that can't run it. See app/scripts/native-signature.mjs.
      - name: Check the native side is unchanged for this runtimeVersion
        id: native
        continue-on-error: true
        run: npm run native:check
      - name: Export the iOS update
        if: steps.native.outcome == 'success'
        run: |
          npm run export:ios-update
          mkdir -p dist/updates/ios
          cp -R dist-ios/_expo dist-ios/assets dist-ios/manifest.json dist/updates/ios/
          ls -R dist/updates/ios | head -20
        env:
          CI: "1"
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Warn that the iOS update was held back
        if: steps.native.outcome != 'success'
        run: echo "::warning::Native side changed without a runtimeVersion bump; no iOS OTA update published. Bump expo.runtimeVersion in app/app.json and run npm run native:record."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
