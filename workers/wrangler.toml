name               = "weathertempo-pws-proxy"
main               = "pws-proxy.js"
compatibility_date = "2024-01-01"

# Workers Caching: Cloudflare keeps each response for as long as its
# Cache-Control header allows and answers repeat requests without running the
# Worker (so without calling Open-Meteo or the weather station again).
# Needs wrangler 4.69+. The lifetimes are set in pws-proxy.js.
[cache]
enabled = true

# The WEATHER_API secret is stored via:
#   npx wrangler secret put WEATHER_API
# Do NOT add it here — secrets must never appear in source control.
